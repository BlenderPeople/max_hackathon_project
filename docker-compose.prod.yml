name: max-order

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_DEMO_DATA: "0"
    volumes:
      - order_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'

  notifications:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.notification_worker

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_MODE: real
        # The frontend link must point to the same bot as webhook delivery.
        VITE_MAX_BOT_USERNAME: ${MAX_BOT_USERNAME}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  order_uploads:
  caddy_data:
  caddy_config:
