name: max-order

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - order_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh scripts/start.sh

  notifications:
    profiles: ["notifications"]
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.notification_worker

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
      # Keep one source of truth for bot links in backend and frontend.
      VITE_MAX_BOT_USERNAME: ${MAX_BOT_USERNAME}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    # The named node_modules volume survives image rebuilds. npm ci makes its
    # contents match the lockfile on every local start, including after a
    # dependency change or an older development volume.
    command: sh -c 'npm ci && exec npm run dev -- --host 0.0.0.0'

volumes:
  postgres_data:
  frontend_node_modules:
  order_uploads:
